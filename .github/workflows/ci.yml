name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build C++ Engine and Run Tests
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: github-actions-test-secret-key-not-for-production
      ACCESS_TOKEN_EXPIRE_MINUTES: "10"

      ADMIN_USERNAME: ci_admin
      ADMIN_PASSWORD: CiAdminPassword2026!

      USER_USERNAME: ci_user
      USER_PASSWORD: CiUserPassword2026!

      DATABASE_URL: sqlite:///data/ci_quant_app.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            -r requirements-dev.txt

      - name: Compile C++ quant engine
        run: |
          g++ \
            -std=c++17 \
            -O2 \
            -Wall \
            -Wextra \
            -pedantic \
            src/engine.cpp \
            -o src/engine

          chmod +x src/engine

      - name: Generate financial signals
        run: |
          ./src/engine
          test -s data/signals.csv

      - name: Validate Python source
        run: |
          python -m py_compile \
            src/api.py \
            src/database.py \
            src/add_user.py

      - name: Run automated tests
        run: |
          python -m pytest
